spring.application.name=siscatharsis

spring.datasource.url=jdbc:postgresql://database:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

server.contextPath=/
server.port=12321

logging.level.org.springframework.web=debug
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet.HandlerMapping=DEBUG
logging.level.org.springframework.web.servlet.HandlerAdapter=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
spring.mvc.log-request-details=true

management.endpoints.web.exposure.include=health

jwt.secret="LARGE RANDOM ASS STRING LMAO TRY TO GUESS IT"
jwt.access.expiration=3600000
jwt.refresh.expiration=3600000

admin.username=admin
admin.password=
